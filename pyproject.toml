[project]
name = "deepanc"
version = "0.1.0"
description = "Reproduction of Zhang & Wang, 'Deep ANC: A deep learning approach to active noise control' (Neural Networks 141, 2021)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.2,<2.7",  # this cluster's driver (550.54.14) tops out at CUDA 12.4; torch>=2.7 bundles CUDA 12.6+
  "numpy>=1.26,<2.0",
  "scipy>=1.11",
  "soundfile>=0.12",
  "soxr>=0.3",
  "pystoi>=0.4",
  "pesq>=0.0.4",
  "numba>=0.59",
  "h5py>=3.10",
  "rir-generator>=0.2",
  "omegaconf>=2.3",
  "tensorboard>=2.16",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepanc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
